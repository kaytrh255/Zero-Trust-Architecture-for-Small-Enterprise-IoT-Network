name: Build and Compose integration

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - arena/01a0e6cb-zero-trust-architecture-for-sm

permissions:
  contents: read

concurrency:
  group: phase8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Create ephemeral local Compose environment
        shell: bash
        run: |
          cp .env.example .env
          for key in POSTGRES_ADMIN_PASSWORD DB_PASSWORD ADMIN_PASSWORD MQTT_DYNSEC_ADMIN_PASSWORD MQTT_BACKEND_PASSWORD; do
            value="$(openssl rand -hex 24)"
            sed -i "s|^${key}=.*|${key}=${value}|" .env
            if [ "${key}" = ADMIN_PASSWORD ]; then
              echo "PHASE8_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
            fi
          done
          jwt_secret="$(openssl rand -base64 32 | tr -d '\n')"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${jwt_secret}|" .env

      - name: Start PostgreSQL, Mosquitto, and backend
        run: docker compose up --build --detach

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color --timestamps
          exit 1

      - name: Run Phase 8 Compose integration test
        working-directory: backend
        env:
          PHASE8_INTEGRATION: 'true'
          PHASE8_ADMIN_USERNAME: admin
          PHASE8_BASE_URL: http://127.0.0.1:8080
          PHASE8_MQTT_BROKER_URI: ssl://127.0.0.1:8883
          PHASE8_MQTT_CA_FILE: ${{ github.workspace }}/mosquitto/tls/ca.crt
        run: mvn --batch-mode -Dtest=Phase8ComposeIntegrationTest test

      - name: Add Maven test reports to the job summary
        if: always()
        shell: bash
        run: |
          for report in backend/target/surefire-reports/*.txt; do
            [ -f "$report" ] || continue
            {
              echo
              echo "### $(basename "$report")"
              echo
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Annotate Phase 8 failure details
        if: failure()
        working-directory: backend
        shell: bash
        run: |
          report=target/surefire-reports/com.yak.zerotrust.integration.Phase8ComposeIntegrationTest.txt
          if [ ! -f "$report" ] || ! grep -Eq 'Failures: [1-9][0-9]*|Errors: [1-9][0-9]*' "$report"; then
            exit 0
          fi
          detail="$(head -c 6000 "$report" | tr '\r\n' '  ' | tr -s ' ')"
          detail="${detail//'%'/'%25'}"
          echo "::error title=Phase 8 integration test failure::${detail}"

      - name: Annotate backend error details
        if: failure()
        shell: bash
        run: |
          backend_errors="$(docker compose logs --no-color --since 1m backend 2>&1 \
            | grep -iE 'WARN|ERROR|Exception|Caused by:|mqtt|telemetry|audit|policy' \
            | tail -n 40 | awk '{printf "%s ", $0}' | tr -s ' ' || true)"
          if [ -n "$backend_errors" ]; then
            backend_errors="${backend_errors:0:6000}"
            backend_errors="${backend_errors//'%'/'%25'}"
            echo "::error title=Backend error log details::${backend_errors}"
          fi

      - name: Annotate broker logs on failure
        if: failure()
        shell: bash
        run: |
          broker_log="$(docker compose logs --no-color --since 1m mosquitto 2>&1 \
            | grep -Ei 'not author|denied|acl|error|PHASE8-SENSOR|PHASE8-ACTUATOR|iot/telemetry' \
            | tail -n 40 | awk '{printf "%s ", $0}' | tr -s ' ' || true)"
          if [ -n "$broker_log" ]; then
            broker_log="${broker_log:0:6000}"
            broker_log="${broker_log//'%'/'%25'}"
            echo "::error title=Mosquitto broker log details::${broker_log}"
          fi

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps || true

      - name: Stop stack and remove ephemeral volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
