name: Build and Compose integration (Phase 18)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - arena/01a0e6cb-zero-trust-architecture-for-sm

permissions:
  contents: read

concurrency:
  group: phase18-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        working-directory: backend
        run: mvn --batch-mode test

      - name: Create ephemeral local Compose environment
        shell: bash
        run: |
          cp .env.example .env
          for key in POSTGRES_ADMIN_PASSWORD DB_PASSWORD DB_MIGRATION_PASSWORD ADMIN_PASSWORD MQTT_DYNSEC_ADMIN_PASSWORD MQTT_BACKEND_PASSWORD; do
            value="$(openssl rand -hex 24)"
            sed -i "s|^${key}=.*|${key}=${value}|" .env
            if [ "${key}" = ADMIN_PASSWORD ]; then
              echo "PHASE10_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
              echo "PHASE11_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
              echo "PHASE13_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
              echo "PHASE14_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
              echo "PHASE16_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
            fi
          done
          jwt_secret="$(openssl rand -base64 32 | tr -d '\n')"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${jwt_secret}|" .env
          # Enable packet-header tracing only in this disposable CI checkout.
          sed -i '/^log_type information$/a log_type debug' mosquitto/config/mosquitto.conf

      - name: Start PostgreSQL, Mosquitto, and backend
        run: docker compose up --build --detach

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color --timestamps postgres db-roles-init db-migrate mqtt-init mqtt-bootstrap backend || true
          docker compose logs --no-color --timestamps mosquitto \
            | grep -Ei 'not author|denied|error|iot/telemetry|dynsec' || true
          exit 1

      - name: Run Phase 10, 12, and 18 Compose integration test
        working-directory: backend
        env:
          PHASE10_INTEGRATION: 'true'
          PHASE10_ADMIN_USERNAME: admin
          PHASE10_BASE_URL: http://127.0.0.1:8080
          PHASE10_MQTT_BROKER_URI: ssl://127.0.0.1:8883
          PHASE10_MQTT_CA_FILE: ${{ github.workspace }}/mosquitto/tls/ca.crt
        run: mvn --batch-mode -Dtest=Phase10ComposeIntegrationTest test

      - name: Run Phase 11 and 12 audit integration test
        working-directory: backend
        env:
          PHASE11_INTEGRATION: 'true'
          PHASE11_ADMIN_USERNAME: admin
          PHASE11_BASE_URL: http://127.0.0.1:8080
        run: mvn --batch-mode -Dtest=Phase11ComposeIntegrationTest test

      - name: Run Phase 13 audit integrity integration test
        working-directory: backend
        env:
          PHASE13_INTEGRATION: 'true'
          PHASE13_ADMIN_USERNAME: admin
          PHASE13_BASE_URL: http://127.0.0.1:8080
        run: mvn --batch-mode -Dtest=Phase13AuditIntegrityComposeIntegrationTest test

      - name: Run Phase 14 database-role integration test
        working-directory: backend
        env:
          PHASE14_INTEGRATION: 'true'
          PHASE14_ADMIN_USERNAME: admin
          PHASE14_BASE_URL: http://127.0.0.1:8080
        run: mvn --batch-mode -Dtest=Phase14DatabaseRolesComposeIntegrationTest test

      - name: Run Phase 16 authentication-audit integration test
        working-directory: backend
        env:
          PHASE16_INTEGRATION: 'true'
          PHASE16_ADMIN_USERNAME: admin
          PHASE16_BASE_URL: http://127.0.0.1:8080
        run: mvn --batch-mode -Dtest=Phase16AuthenticationAuditComposeIntegrationTest test

      - name: Reset process-local limiter before Phase 17
        run: docker compose restart backend

      - name: Wait for backend after rate-limit reset
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --timestamps backend || true
          exit 1

      - name: Run Phase 17 login rate-limit integration test
        working-directory: backend
        env:
          PHASE17_INTEGRATION: 'true'
          PHASE17_IP_MAX_ATTEMPTS: '20'
          PHASE17_WINDOW_SECONDS: '60'
          PHASE17_BASE_URL: http://127.0.0.1:8080
        run: mvn --batch-mode -Dtest=Phase17LoginRateLimitComposeIntegrationTest test

      - name: Add Maven test reports to the job summary
        if: always()
        shell: bash
        run: |
          for report in backend/target/surefire-reports/*.txt; do
            [ -f "$report" ] || continue
            {
              echo
              echo "### $(basename "$report")"
              echo
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Annotate Compose integration test failure details
        if: failure()
        working-directory: backend
        shell: bash
        run: |
          for report in \
            target/surefire-reports/com.yak.zerotrust.integration.Phase10ComposeIntegrationTest.txt \
            target/surefire-reports/com.yak.zerotrust.integration.Phase11ComposeIntegrationTest.txt \
            target/surefire-reports/com.yak.zerotrust.integration.Phase13AuditIntegrityComposeIntegrationTest.txt \
            target/surefire-reports/com.yak.zerotrust.integration.Phase14DatabaseRolesComposeIntegrationTest.txt \
            target/surefire-reports/com.yak.zerotrust.integration.Phase16AuthenticationAuditComposeIntegrationTest.txt \
            target/surefire-reports/com.yak.zerotrust.integration.Phase17LoginRateLimitComposeIntegrationTest.txt; do
            if [ ! -f "$report" ] || ! grep -Eq 'Failures: [1-9][0-9]*|Errors: [1-9][0-9]*' "$report"; then
              continue
            fi
            detail="$(head -c 6000 "$report" | tr '\r\n' '  ' | tr -s ' ')"
            detail="${detail//'%'/'%25'}"
            echo "::error title=Compose integration test failure::${detail}"
          done

      - name: Annotate backend error details
        if: failure()
        shell: bash
        run: |
          backend_errors="$(docker compose logs --no-color --since 1m backend 2>&1 \
            | grep -iE 'WARN|ERROR|Exception|Caused by:|mqtt|telemetry|audit|policy' \
            | tail -n 40 | awk '{printf "%s ", $0}' | tr -s ' ' || true)"
          if [ -n "$backend_errors" ]; then
            backend_errors="${backend_errors:0:6000}"
            backend_errors="${backend_errors//'%'/'%25'}"
            echo "::error title=Backend error log details::${backend_errors}"
          fi

      - name: Annotate broker logs on failure
        if: failure()
        shell: bash
        run: |
          broker_log="$(docker compose logs --no-color --since 1m mosquitto 2>&1 \
            | grep -Ei 'not author|denied|acl|error|PHASE10-SENSOR|PHASE10-ACTUATOR|PHASE11-SENSOR|iot/telemetry' \
            | tail -n 40 | awk '{printf "%s ", $0}' | tr -s ' ' || true)"
          if [ -n "$broker_log" ]; then
            broker_log="${broker_log:0:6000}"
            broker_log="${broker_log//'%'/'%25'}"
            echo "::error title=Mosquitto broker log details::${broker_log}"
          fi

      - name: Dump Compose logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose logs --no-color --timestamps postgres db-roles-init db-migrate mqtt-init mqtt-bootstrap backend || true
          docker compose logs --no-color --timestamps mosquitto \
            | grep -Ei 'PUBLISH.*iot/telemetry|not author|denied|PHASE10-|PHASE11-|iot/telemetry|dynsec:.*(createClient|modifyClient)' || true

      - name: Stop stack and remove ephemeral volumes
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          else
            echo 'No Compose environment was created; skipping cleanup.'
          fi
